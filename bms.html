<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Book Management System</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body>
<div class="container mx-auto max-w-5xl p-5">
    <h1 class="text-4xl font-bold text-center text-blue-700 mb-8"> Book Management System
    </h1>
    <form id="bms">
        <label>Title</label>
        <input type="text" id="title" name="title">
        <label>Author</label>
        <input type="text" id="author" name="author">
        <label>ISBN</label>
        <input type="text" id="isbn" name="isbn">
        <label>Publication Date</label>
        <input type="date" id="publicationDate"name="publicationDate">
        <label>Genre</label>
        <select id="genre" name="genre">
            <option value="">Select Genre</option>
            <option>Fiction</option>
            <option>History</option>
            <option>Romance</option>
            <option>Thriller</option>
            <option>Autobiography</option>
        </select>
        <button id="bmsBtn">
            Add Book
        </button>
    </form>
    <div class="tools">
        <div>
            <label>Search Book</label>
            <input type="text" id="searchBook" placeholder="Enter title...">
            <button id="searchBtn">Search</button>
        </div>
        <div>
            <label>Sort Books</label>
            <select id="sortBooks">
                <option value="">Select</option>
                <option value="title">Title</option>
                <option value="genre">Genre</option>
                <option value="date">Publication Date</option>
            </select>
            <button id="sortBtn">Sort Books</button>
        </div>
        <div>
            <button id="fetchBtn">
                Fetch Sample Books
            </button>
        </div>
    </div>
    <div id="result"></div>
    <h2 class="text-3xl font-bold text-center mt-10 mb-5">Registered Books</h2>
    <ol id="bookList"></ol>
</div>
<script src="script.js"></script>
</body>
</html>
