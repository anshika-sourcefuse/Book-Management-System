<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Book Management System</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
<div class="container">
 <h1 class="main-heading">Book Management System</h1>
    <form id="bms">
        <label for="title">Title</label>
        <input type="text" id="title" name="title">
        <label for="author">Author</label>
        <input type="text" id="author" name="author">
        <label for="isbn">ISBN</label>
        <input type="text" id="isbn" name="isbn">
       <label for="price">Price</label>
        <input type="text" id="price" name="price">
       <label for="publicationDate">Publication Date</label>
        <input type="date" id="publicationDate" name="publicationDate">
      <label for="genre">Genre</label>
        <select id="genre" name="genre">
            <option value="">Select Genre</option>
            <option>Fiction</option>
            <option>History</option>
            <option>Romance</option>
            <option>Thriller</option>
            <option>Autobiography</option>
        </select>
      <label for="bookType">Book Type</label>
        <select id="bookType" name="bookType">
            <option value="">Select Book Type</option>
            <option value="printed">Printed Book</option>
            <option value="ebook">E-Book</option>
        </select>
        <button id="bmsBtn">
            Add Book
        </button>
    </form>
    <div class="tools">
        <div>
        <label for="searchBook">Search Book</label>
            <input type="text" id="searchBook" placeholder="Enter title...">
            <button id="searchBtn">Search</button>
        </div>
        <div>
         <label for="sortBooks">Sort Books</label>
            <select id="sortBooks">
                <option value="">Select</option>
                <option value="title">Title</option>
                <option value="genre">Genre</option>
                <option value="date">Publication Date</option>
            </select>
            <button id="sortBtn">Sort Books</button>
        </div>
        <div>
            <button id="fetchBtn">
                Fetch Sample Books
            </button>
        </div>
    </div>
    <div id="result"></div>
   <h2 class="section-heading">Registered Books</h2>
    <ol id="bookList"></ol>
</div>
<script src="script.js"></script>
</body>
</html>
